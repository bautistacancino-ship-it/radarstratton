<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Radar Stratton O'Higgins</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,800;1,700;1,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy brand band with KPIs, filter rail, card grid; detail opens as a side sheet (full sheet on phones) */
:root{
  --ink:#0d1636;        /* Stratton navy */
  --ink-2:#17234f;
  --cyan:#0fe3d6;       /* Stratton turquoise */
  --cyan-ink:#067a74;   /* turquoise legible on white */
  --bg:#eef1f7;
  --surface:#ffffff;
  --surface-2:#f5f7fb;
  --line:#dde2ee;
  --fg:#111a3a;
  --muted:#5b6587;
  --hi:#0f8a5f; --hi-bg:#dcf5ea;
  --mid:#a76400; --mid-bg:#fff0d2;
  --lo:#5b6587; --lo-bg:#eceff5;
  --shadow:0 1px 2px rgba(13,22,54,.06),0 8px 24px rgba(13,22,54,.07);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070c22;--surface:#0f1838;--surface-2:#131e45;--line:#24305e;--fg:#e8ecfb;--muted:#9aa5cc;
  --cyan-ink:#2ff0e3;--ink:#050a1e;--ink-2:#0d1636;
  --hi:#4ee0a6;--hi-bg:#0f3a2e;--mid:#ffc260;--mid-bg:#3b2c10;--lo:#9aa5cc;--lo-bg:#1c2650;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070c22;--surface:#0f1838;--surface-2:#131e45;--line:#24305e;--fg:#e8ecfb;--muted:#9aa5cc;
  --cyan-ink:#2ff0e3;--ink:#050a1e;--ink-2:#0d1636;
  --hi:#4ee0a6;--hi-bg:#0f3a2e;--mid:#ffc260;--mid-bg:#3b2c10;--lo:#9aa5cc;--lo-bg:#1c2650;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* brand band (always navy) */
.band{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.band::before,.band::after{content:"";position:absolute;border-radius:999px;background:#0fe3d6;transform:rotate(-40deg)}
.band::before{width:220px;height:34px;right:-40px;top:26px;opacity:.95}
.band::after{width:160px;height:34px;right:40px;top:80px;opacity:.35}
.slab{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.035) 40%,rgba(255,255,255,.035) 62%,transparent 62%)}
.band .wrap{position:relative;padding-block:28px 30px;display:grid;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand b i{color:#0fe3d6;font-style:italic}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b8c2e6;font-style:italic;margin-top:-2px}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,5vw,48px);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance;max-width:18ch}
h1 em{font-style:italic;font-weight:800;color:#0fe3d6}
h1 strong{font-style:italic;font-weight:800}
.sub{color:#b8c2e6;max-width:62ch;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:#b8c2e6;margin-top:4px}
.kpi.hot .v{color:#0fe3d6}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.band::before,.band::after{display:none}}

/* filters */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink-2);color:#fff}
select.sel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600;font-size:13px}
.count{font-size:13px;color:var(--muted);margin-left:auto}

/* grid */
main .wrap{padding-block:22px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:var(--cyan-ink)}
.top{display:flex;gap:12px;align-items:flex-start}
.av{width:42px;height:42px;border-radius:12px;background:var(--ink-2);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;flex:none}
.top .t{min-width:0;flex:1}
.name{font-weight:700;font-size:16px;line-height:1.25;margin:0}
.meta{font-size:13px;color:var(--muted)}
.score{flex:none;text-align:right}
.score .n{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.score .n small{font-size:12px;color:var(--muted);font-style:normal;font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.p-Alta{color:var(--hi);background:var(--hi-bg)}.p-Media{color:var(--mid);background:var(--mid-bg)}.p-Baja{color:var(--lo);background:var(--lo-bg)}
.meter{display:grid;grid-template-columns:3fr 3fr 2fr 2fr;gap:3px}
.meter span{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.meter span i{position:absolute;inset:0;background:var(--cyan-ink);transform-origin:left}
.service{font-size:13.5px;margin:0}
.service b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.stars{font-family:var(--f-data);font-size:12.5px;color:var(--fg)}
.web{font-size:12px;font-weight:600}
.web.no{color:var(--mid)}.web.yes{color:var(--cyan-ink)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,30,.5);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(5,10,30,.25);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:in .22s ease}
@keyframes in{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.sh-head{background:var(--ink);color:#fff;padding:18px 20px 20px;display:grid;gap:12px}
.sh-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:rgba(255,255,255,.12);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.sh-head h2{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.sh-head .meta{color:#b8c2e6}
.sh-body{overflow-y:auto;padding:18px 20px 28px;display:grid;gap:18px}
.sec h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.sec p{margin:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.fact .v{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:20px;font-variant-numeric:tabular-nums}
.fact .l{font-size:12px;color:var(--muted)}
.bk{display:grid;gap:8px}
.bk-row{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.bk-row .track{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bk-row .track i{display:block;height:100%;background:var(--cyan-ink)}
.bk-row .num{font-family:var(--f-data);font-size:12px;text-align:right;color:var(--muted)}
.callout{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.msg{background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px;font-size:14.5px;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.btn.cy{background:#0fe3d6;border-color:#0fe3d6;color:#07122e}
.btn svg{width:16px;height:16px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-data);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink-2);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:420px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.bk-row{grid-template-columns:90px 1fr 32px}}
</style>
</head>
<body>


<header class="band">
  <div class="slab"></div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="4" width="10" height="34" rx="5" transform="rotate(40 11 21)" fill="#0fe3d6"/><rect x="22" y="2" width="10" height="34" rx="5" transform="rotate(40 27 19)" fill="#0fe3d6"/></svg>
      <div><b>Stratt<i>on</i></b><small>Digital partner</small></div>
    </div>
    <h1>Leads de <strong>gastronomía y retail</strong> en <em>O'Higgins</em></h1>
    <p class="sub">33 negocios de la Sexta Región con señales de que necesitan web, mejor presencia en Google o venta online. Ordenados por puntaje de oportunidad. Datos de Google Maps al 15-10-2026.</p>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar negocio, rubro o señal" autocomplete="off"></label>
    <div class="seg" role="group" aria-label="Prioridad" id="seg">
      <button aria-pressed="true" data-p="">Todas</button><button aria-pressed="false" data-p="Alta">Alta</button><button aria-pressed="false" data-p="Media">Media</button><button aria-pressed="false" data-p="Baja">Baja</button>
    </div>
    <select class="sel" id="com" aria-label="Comuna"><option value="">Todas las comunas</option></select>
    <select class="sel" id="tipo" aria-label="Tipo"><option value="">Gastronomía y retail</option><option value="g">Solo gastronomía</option><option value="r">Solo retail</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<main><div class="wrap"><div class="grid" id="grid"></div></div></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-name"></aside>
<div class="toast" id="toast" hidden></div>

<script>
const LEADS = [{"n": "Pastelería Rodrigo", "r": "Pastelería", "c": "Rancagua", "d": "Av. Illanes 522 (+ sucursal Av. Bombero Villalobos 170)", "t": "+56 72 239 8554", "wa": "56722398554", "rt": 4.5, "rs": 813, "w": "web.pasteleriarodrigo.cl: dice 'Página en construcción', solo informativa; imágenes de categorías no cargan; íconos de redes apuntan a facebook.com/instagram.com genéricos", "v": "Sí", "s": "Reseñas: filas de +30 min para comprar un trozo de torta. 2 sucursales y contratando personal (aviso sept-2026). Pedidos solo por WhatsApp/teléfono. Ojo: web firmada por Agencia Emagenic.", "sv": "E-commerce de tortas con retiro programado por sucursal + pago online", "sc": [3, 3, 2, 2], "tot": 10, "p": "Alta", "m": "Hola, ¿cómo están? Soy [Nombre] de Stratton. Soy fan de sus tortas y vi que su web todavía dice 'en construcción' y que los pedidos se hacen solo por WhatsApp, mientras en tienda se forman filas largas. Ayudamos a pastelerías a recibir pedidos y pagos online con hora de retiro, para descongestionar el mesón. ¿Les puedo mostrar un ejemplo en 10 minutos esta semana?"}, {"n": "Mini Restaurant", "r": "Restaurante chileno", "c": "Olivar", "d": "Olivar Bajo, Olivar", "t": "+56 9 8463 9391", "wa": "56984639391", "rt": 4.6, "rs": 6346, "w": "minirestaurant.cl (Wix): carta enlazada a una carpeta de Google Drive; widget de Instagram sin configurar (muestra '@wix'); sin pedidos online", "v": "Sí", "s": "Más de 6.300 reseñas y local lleno con espera por mesa. Historia desde 1974, tercera generación. Gran volumen = alto impacto de una web bien hecha.", "sv": "Rediseño web con carta integrada (no Drive), reservas y SEO local", "sc": [2, 3, 2, 1], "tot": 8, "p": "Alta", "m": "Hola, soy [Nombre] de Stratton. Fui a ver la web del Mini y la historia desde 1974 está preciosa, pero la carta abre en una carpeta de Google Drive y el bloque de Instagram quedó con el texto de prueba '@wix'. Con más de 6.000 reseñas, mucha gente los busca en el celular antes de ir. ¿Les interesa que les mande una propuesta corta para dejar carta y reservas funcionando directo en la web?"}, {"n": "La Picá del Negro", "r": "Restaurante chileno", "c": "Pichilemu", "d": "José Joaquín Prieto 350", "t": "+56 72 284 2830", "wa": "56722842830", "rt": 4.2, "rs": 2937, "w": "No encontré web propia en revisión rápida", "v": "No", "s": "Casi 3.000 reseñas, pero varias recientes hablan de esperas de 40 min y mesas sin atender. Rating 4,2 arrastrado por servicio. Público turista en temporada.", "sv": "Lista de espera/reservas online + gestión de reseñas en Google", "sc": [3, 3, 2, 0], "tot": 8, "p": "Alta", "m": "Hola, soy [Nombre] de Stratton. La Picá es parada obligada en Pichilemu, pero vi que varias reseñas recientes en Google mencionan esperas largas y eso les baja la nota. Trabajamos con restaurantes de alto flujo para ordenar reservas/lista de espera online y responder reseñas, antes de que llegue la temporada de verano. ¿Conversamos 10 minutos?"}, {"n": "Rigoletto Restaurante", "r": "Restaurante / pastelería", "c": "San Fernando", "d": "Av. Manuel Rodríguez 751", "t": "+56 9 3919 2010", "wa": "56939192010", "rt": 4.2, "rs": 1093, "w": "No encontré web propia en revisión rápida", "v": "No", "s": "Más de 1.000 reseñas; reseñas negativas sobre atención sin respuesta del local. Mezcla restaurante, cafetería, heladería y pastelería: mucho catálogo para mostrar.", "sv": "Web con carta y pedidos de tortas + gestión de reputación", "sc": [3, 3, 2, 0], "tot": 8, "p": "Alta", "m": "Hola, soy [Nombre] de Stratton. Rigoletto tiene más de mil reseñas en Google, pero vi algunas negativas sin respuesta que pesan en la nota. Ayudamos a locales de San Fernando a cuidar su reputación online y a vender tortas y helados por encargo desde su propia web. ¿Les puedo mandar un diagnóstico gratis de su perfil?"}, {"n": "SonríeTé – La Tetería de Rengo", "r": "Cafetería / tienda de té", "c": "Rengo", "d": "Morán 206-298", "t": "+56 72 257 8307", "wa": "56722578307", "rt": 4.6, "rs": 235, "w": "No encontré web propia en revisión rápida", "v": "No", "s": "Venden té a granel y accesorios (teteras, infusores) en tienda: producto ideal para vender online a todo Chile. Algunas reseñas negativas de atención.", "sv": "Tienda online de tés y accesorios con despacho nacional", "sc": [3, 2, 2, 1], "tot": 8, "p": "Alta", "m": "Hola, soy [Nombre] de Stratton. Me encantó que tengan té a granel y accesorios para amantes del té; es justo el tipo de producto que se vende muy bien online fuera de Rengo. No encontré una tienda web suya, ¿lo han pensado? Armamos tiendas online simples con despacho a todo Chile. ¿Les muestro un ejemplo?"}, {"n": "Aroma Limeño", "r": "Restaurante peruano", "c": "Machalí", "d": "Av. San Juan 202", "t": "+56 72 248 9928", "wa": "56722489928", "rt": 4.6, "rs": 2993, "w": "aromalimeno.cl: WordPress con tema de 2019; la carta es un PDF de oct-2024; delivery deriva a un sistema externo", "v": "Sí", "s": "Casi 3.000 reseñas. También ofrece tortas y banquetería: servicios que se venden mejor con una web actual.", "sv": "Renovación web: carta digital actualizable, banquetería con cotizador, SEO", "sc": [2, 3, 1, 1], "tot": 7, "p": "Media", "m": "Hola, soy [Nombre] de Stratton. Revisé la web de Aroma Limeño y la carta que se descarga es un PDF de octubre 2024; además la banquetería y las tortas quedan un poco escondidas. Con casi 3.000 reseñas, una web actualizada puede traerles más eventos. ¿Les mando una propuesta de renovación sin compromiso?"}, {"n": "Bocas del Mar", "r": "Restaurante peruano", "c": "Pichilemu", "d": "Av. Costanera 730", "t": "+56 9 7568 6598", "wa": "56975686598", "rt": 4.4, "rs": 1532, "w": "bocasdelmar.cl respondió con error (401) al revisarlo: posible web caída o protegida", "v": "Parcial", "s": "1.500+ reseñas, muchas de turistas extranjeros. Abierto todos los días hasta medianoche. Comentan que se llena.", "sv": "Web bilingüe (ES/EN) con carta y reservas", "sc": [2, 3, 1, 1], "tot": 7, "p": "Media", "m": "Hola, soy [Nomb Gallery – Tienda Centro", "r": "Tienda de ropa", "c": "Rancagua", "d": "O'Carrol 603, Local 1", "t": "+56 9 5922 4958", "wa": "56959224958", "rt": 5.0, "rs": 14, "w": "No encontré web propia en revisión rápida", "v": "No", "s": "Retail de ropa con nota 5,0 y novedades constantes. Pocas reseñas.", "sv": "Tienda online / catálogo + Instagram Shopping", "sc": [3, 0, 1, 1], "tot": 5, "p": "Baja", "m": "Hola, soy [Nombre] de Stratton. Vi que siempre tienen novedades y ofertas en la tienda del centro. ¿Venden online? Les podemos armar una tienda simple conectada a Instagram. ¿Les muestro un ejemplo?"}, {"n": "D'licia Criolla", "r": "Cafetería / almuerzo", "c": "Rengo", "d": "José Bisquertt 218", "t": null, "wa": null, "rt": 4.7, "rs": 83, "w": "No encontré web; sin teléfono en Google", "v": "No", "s": "Menú con opciones para dietas especiales (sin lactosa, veggie) — diferenciador poco comunicado.", "sv": "Perfil Google completo + carta online destacando opciones especiales", "sc": [3, 1, 1, 0], "tot": 5, "p": "Baja", "m": "Hola, soy [Nombre] de Stratton. Vi que ofrecen opciones sin lactosa y vegetarianas, algo que mucha gente busca en Google. Su perfil no tiene teléfono ni carta online; podemos ayudarles a destacarlo. (Contactar presencial o por Instagram)"}, {"n": "Café La Despensa", "r": "Cafetería", "c": "Rengo", "d": "Arturo Prat 317", "t": "+56 9 8439 4150", "wa": "56984394150", "rt": 4.6, "rs": 79, "w": "No encontré web propia en revisión rápida", "v": "No", "s": "Buena reputación, decoración vintage. Sin señal de dolor fuerte.", "sv": "Landing + carta QR", "sc": [3, 1, 0, 0], "tot": 4, "p": "Baja", "m": "Hola, soy [Nombre] de Stratton. Café La Despensa tiene clientes muy fieles en Rengo. ¿Les gustaría tener una carta digital y una página simple para aparecer mejor en Google? ¿Les muestro un ejemplo?"}, {"n": "Dreamstyle Surf Company", "r": "Tienda de surf", "c": "Pichilemu", "d": "Manuel Rodríguez 355", "t": "+56 72 284 3054", "wa": "56722843054", "rt": 5.0, "rs": LEADS.forEach((l,i)=>{l.id=i;l.retail=/florer|tienda|surf/i.test(l.r)});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={q:'',p:'',c:'',t:''};
try{const s=JSON.parse(localStorage.getItem('radar-f')||'{}');Object.assign(st,s)}catch(e){}

// KPIs
const by=p=>LEADS.filter(l=>l.p===p).length;
const sinWeb=LEADS.filter(l=>/No encontré/i.test(l.w)).length;
$('#kpis').innerHTML=[[LEADS.length,'leads en 7 comunas'],[by('Alta'),'prioridad alta','hot'],[by('Media'),'prioridad media'],[sinWeb,'sin web propia detectada']]
 .map(([v,l,c])=>`<div class="kpi ${c||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

[...new Set(LEADS.map(l=>l.c))].sort().forEach(c=>$('#com').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`));

const ini=n=>n.replace(/^(Restaurant(e)?|Pastelería y Panadería|Pastelería|Café|Cafetería|Tienda de Surf|The|La|El)\s+/i,'').trim()[0].toUpperCase();
const stars=r=>`★ ${r.toFixed(1).replace('.',',')}`;
const fmt=n=>n.toLocaleString('es-CL');
const webTag=l=>/No encontré/i.test(l.w)?'<span class="web no">Sin web detectada</span>':'<span class="web yes">Tiene web · revisar</span>';

function render(){
  const q=st.q.trim().toLowerCase();
  const list=LEADS.filter(l=>(!st.p||l.p===st.p)&&(!st.c||l.c===st.c)&&(!st.t||(st.t==='r')===l.retail)&&
    (!q||[l.n,l.r,l.c,l.s,l.sv].join(' ').toLowerCase().includes(q)));
  $('#count').textContent=`${list.length} de ${LEADS.length}`;
  $('#grid').innerHTML=list.length?list.map(l=>`
   <button class="card" data-id="${l.id}" aria-label="Ver detalle de ${esc(l.n)}">
     <div class="top">
       <div class="av" aria-hidden="true">${esc(ini(l.n))}</div>
       <div class="t"><p class="name">${esc(l.n)}</p><div class="meta">${esc(l.r)} · ${esc(l.c)}</div></div>
       <div class="score"><div class="n">${l.tot}<small>/10</small></div><span class="pill p-${l.p}">${l.p}</span></div>
     </div>
     <div class="meter" title="Web · Volumen · Dolor · Crecimiento">${l.sc.map((v,i)=>`<span><i style="transform:scaleX(${v/[3,3,2,2][i]})"></i></span>`).join('')}</div>
     <p class="service"><b>Qué ofrecerle</b>${esc(l.sv)}</p>
     <div class="foot"><span class="stars">${stars(l.rt)} · ${fmt(l.rs)} reseñas</span>${webTag(l)}</div>
   </button>`).join(''):`<div class="empty">Ningún lead coincide con estos filtros. Prueba con otra comuna o prioridad.</div>`;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===st.p));
  $('#q').value=st.q;$('#com').value=st.c;$('#tipo').value=st.t;
  try{localStorage.setItem('radar-f',JSON.stringify(st))}catch(e){}
}

const LBL=[['Sin web / web débil',3],['Volumen de reseñas',3],['Dolor visible',2],['Crecimiento',2]];
let lastFocus=null;
function open(id){
  const l=LEADS[id];lastFocus=document.activeElement;
  const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l.n+' '+l.d+' '+l.c);
  const wa=l.wa?'https://wa.me/'+l.wa+'?text='+encodeURIComponent(l.m):null;
  $('#sheet').innerHTML=`
   <div class="sh-head">
     <div class="sh-row"><span class="pill p-${l.p}">Prioridad ${l.p}</span><button class="x" id="close" aria-label="Cerrar">✕</button></div>
     <h2 id="sh-name">${esc(l.n)}</h2>
     <div class="meta">${esc(l.r)} · ${esc(l.d)}, ${esc(l.c)}</div>
   </div>
   <div class="sh-body">
     <div class="facts">
       <div class="fact"><div class="v">${l.tot}/10</div><div class="l">Puntaje</div></div>
       <div class="fact"><div class="v">${l.rt.toFixed(1).replace('.',',')}</div><div class="l">Nota Google</div></div>
       <div class="fact"><div class="v">${fmt(l.rs)}</div><div class="l">Reseñas</div></div>
     </div>
     <section class="sec"><h3>Por qué tiene este puntaje</h3><div class="bk">
       ${LBL.map(([n,mx],i)=>`<div class="bk-row"><span>${n}</span><span class="track"><i style="width:${l.sc[i]/mx*100}%"></i></span><span class="num">${l.sc[i]}/${mx}</span></div>`).join('')}
     </div></section>
     <section class="sec"><h3>Señales de oportunidad</h3><p>${esc(l.s)}</p></section>
     <section class="sec"><h3>Web y presencia actual</h3><div class="callout">${esc(l.w)}<div class="note" style="margin-top:6px">${l.v==='Sí'?'Revisado directamente el 15-10-2026.':l.v==='Parcial'?'Revisión parcial: confirma entrando a la web.':'Revisión rápida: confirma en Google Maps e Instagram antes de escribir.'}</div></div></section>
     <section class="sec"><h3>Qué ofrecerle</h3><p><strong>${esc(l.sv)}</strong></p></section>
     <section class="sec"><h3>Mensaje sugerido</h3><div class="msg" id="msg">${esc(l.m)}</div>
       <p class="note" style="margin-top:6px">Reemplaza [Nombre] por tu nombre antes de enviar.</p></section>
     <section class="sec"><h3>Contacto</h3>
       <div class="contact"><span id="tel">${esc(l.t||'Sin teléfono en Google: visita presencial o Instagram')}</span>${l.t?'<button class="btn" id="cpt">Copiar teléfono</button>':''}</div></section>
     <div class="actions">
       <button class="btn pri" id="cpm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copiar mensaje</button>
       ${wa?`<a class="btn cy" href="${wa}" target="_blank" rel="noopener">Abrir en WhatsApp</a>`:''}
       <a class="btn" href="${maps}" target="_blank" rel="noopener">Ver en Google Maps</a>
     </div>
   </div>`;
  $('#scrim').hidden=false;$('#sheet').hidden=false;document.body.style.overflow='hidden';
  $('#close').onclick=close;$('#close').focus();
  $('#cpm').onclick=()=>copy(l.m,'Mensaje copiado','#msg');
  if(l.t)$('#cpt').onclick=()=>copy(l.t,'Teléfono copiado','#tel');
}
function close(){$('#scrim').hidden=true;$('#sheet').hidden=true;document.body.style.overflow='';lastFocus&&lastFocus.focus()}
function copy(text,ok,sel){
  const fb=()=>{const r=document.createRange();r.selectNodeContents($(sel));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto seleccionado: cópialo con Ctrl/Cmd + C')};
  try{navigator.clipboard.writeText(text).then(()=>toast(ok),fb)}catch(e){fb()}
}
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}

$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.id)});
$('#scrim').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)close()});
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.p=b.dataset.p;render()}});
$('#com').onchange=e=>{st.c=e.target.value;render()};
$('#tipo').onchange=e=>{st.t=e.target.value;render()};
render();
</script>
